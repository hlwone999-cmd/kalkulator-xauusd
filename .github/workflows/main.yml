
name: Build Kalkulator XAUUSD APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Buat proyek Capacitor
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Kalkulator XAUUSD" "com.hlwone999.kalkulatorxauusd" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-XAUUSD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
